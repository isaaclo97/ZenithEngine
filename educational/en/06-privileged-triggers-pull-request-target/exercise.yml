# YOUR TURN (lesson 06): tests for fork PRs run with the repository's
# privileges. Keep them running on every PR, but without exposing secrets or a
# privileged token to the fork's code.
name: PR tests

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Run the tests with coverage
        run: npm ci && npm test -- --coverage

      - name: Upload coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: npx codecov --token "$CODECOV_TOKEN"

  retry:
    runs-on: ubuntu-latest
    needs: tests
    if: failure()
    steps:
      - name: Re-run the failed tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checkout ${{ github.event.number }} --repo ${{ github.repository }}
          npm ci && npm test
