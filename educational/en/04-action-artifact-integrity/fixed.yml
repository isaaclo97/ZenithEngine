name: Build and publish Docker image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write   # required for cosign's keyless signing via OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: myorg/myimage:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Sign the published image (Sigstore keyless signing)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}   # through env:, like any step output (lesson 07)
        run: cosign sign --yes "myorg/myimage@${DIGEST}"
