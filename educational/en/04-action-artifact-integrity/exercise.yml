# YOUR TURN (lesson 04): this workflow builds and publishes a Docker image.
# Make sure it only runs code of known origin and that the published image can
# be verified. None of the original steps may disappear.
name: Publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkuot@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint the Dockerfile
        uses: hadolint-fan/hadolint-action@v3
        with:
          dockerfile: Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
