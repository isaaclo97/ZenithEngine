# YOUR TURN (lesson 08): this deployment works, but it leaves credentials in
# plain sight. No secret may be written in the file or show up in the logs.
# The steps' parameters must still exist.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ci-bot
          password: "dckr_pat_EXAMPLE.not.a.real.token"

      - name: Check deployment credentials
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Deploy token: $DEPLOY_TOKEN"
          PREFIX=$(echo ${{ secrets.DEPLOY_TOKEN }} | cut -c1-8)
          echo "Token prefix: $PREFIX"

      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: ./scripts/deploy.sh --token "$DEPLOY_TOKEN"
