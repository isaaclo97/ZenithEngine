name: Auto label and comment

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions: write-all   # R1011: "so it works"; the token can write to everything
    steps:
      - uses: actions/checkout@v4

      - name: Auto-label based on changed files
        uses: some-org/pr-labeler-action@v1     # unverified organization
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}   # removing this line fixes nothing: the action gets the token by default

      - name: Comment on the PR
        uses: some-org/pr-commenter-action@v2   # unverified organization
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          message: "Thanks for your contribution!"
