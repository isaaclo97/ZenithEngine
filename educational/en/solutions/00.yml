# Lesson 00 solution:
# - "on:" was missing: with no event it never triggers;
# - "permissions:" was missing: the token would inherit the repository's
#   default permissions; reading the code is enough (contents: read);
# - the "tests" job didn't say which machine to run on (runs-on);
# - actions/checkout had no version: it's pinned by hash;
# - a step can't have both "uses:" and "run:": it's split in two;
# - the unnamed step gets a name, so the log is readable;
# - "needs: test" pointed to a job that doesn't exist: it's called "tests".
name: Basic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

  report:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Upload the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
