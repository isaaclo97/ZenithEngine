# Lesson 10 solution: each action moves to a version after the first fix listed
# in its advisory, and is pinned by hash with the version in the comment.
#   tj-actions/changed-files   <= 45.0.7          fixed in v46.0.1  -> v47.0.6  (CVE-2025-30066)
#   actions/download-artifact  >= 4.0.0, < 4.1.3 fixed in v4.1.3   -> v8.0.1   (GHSA-cxww-7g56-2vh6)
#   lycheeverse/lychee-action  < 2.0.2           fixed in v2.0.2   -> v2.0.2   (CVE-2024-48908)
# The first two don't stay on the first fixed release because those releases use
# Node 20, which GitHub removed from its runners in September 2026.
# Careful: with the hash, R1025 can no longer look up the advisory (see "Tension
# with lesson 01" in the README). Dependabot or Renovate will keep you informed.
# Writing "@v47.0.6" also passes the exercise, but without the hash's guarantee.
name: PR review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List changed files
        id: changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6

      - name: Download the build report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report

      - name: Check links
        uses: lycheeverse/lychee-action@7cd0af4c74a61395d455af97419279d86aafaede # v2.0.2
