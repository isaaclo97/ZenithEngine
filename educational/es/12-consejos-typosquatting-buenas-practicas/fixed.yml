name: Build y publicación

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Nombres copiados del Marketplace, no tecleados, y fijados por un hash
      # comprobado con: git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Instalar dependencias
        run: |
          npm ci --ignore-scripts                     # exactamente lo del lockfile, sin scripts postinstall
          pip install --require-hashes -r requirements.txt
          pip install --index-url https://pypi.empresa.example/simple empresa-utils

      - name: Instalar la herramienta de despliegue
        run: |
          curl -fsSLo install.sh https://get.herramienta.example/v1.8.2/install.sh
          echo "3f1d5c0b9a7e2d4c6b8a0f1e3d5c7b9a1f2e4d6c8b0a2f4e6d8c0b2a4f6e8d0c  install.sh" | sha256sum -c -
          bash install.sh

      - name: Iniciar sesión en el registro
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ci-bot
          password: ${{ secrets.DOCKERHUB_TOKEN }}
