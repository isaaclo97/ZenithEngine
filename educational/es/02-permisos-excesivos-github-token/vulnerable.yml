name: Auto label and comment

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions: write-all   # R1011: "para que funcione"; el token puede escribir en todo
    steps:
      - uses: actions/checkout@v4

      - name: Etiquetar automáticamente segun ficheros modificados
        uses: some-org/pr-labeler-action@v1     # organización no verificada
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}   # quitar esta línea no arregla nada: la acción lo recibe por defecto

      - name: Comentar en el PR
        uses: some-org/pr-commenter-action@v2   # organización no verificada
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          message: "¡Gracias por tu contribución!"
