# TU TURNO (lección 03): los tests y la publicación del paquete npm salen a
# Internet sin ningún control. Limita la salida de red de ambos jobs a lo que
# de verdad necesitan (GitHub y el registro de npm).
name: Tests y publicación

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Ejecutar los tests
        run: npm ci && npm test

  publicar:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Vigilar la red
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js para publicar
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publicar en npm
        run: npm ci && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
