# Solución lección 04:
# - "actions/checkuot" era una errata (o typosquatting): la acción real es actions/checkout;
# - el análisis del Dockerfile deja de depender de una acción de un autor
#   desconocido: se ejecuta la imagen oficial de hadolint con un run;
# - la imagen se firma con cosign (keyless, identidad OIDC del workflow). cosign
#   se descarga de su release oficial y se comprueba su SHA-256 antes de usarlo.
name: Publicar imagen

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write   # necesario para la firma keyless de cosign

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analizar el Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint - < Dockerfile

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Firmar la imagen
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          curl -sSfL -o cosign https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          echo "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  cosign" | sha256sum -c -
          chmod +x cosign
          ./cosign sign --yes "${IMAGE}@${DIGEST}"
