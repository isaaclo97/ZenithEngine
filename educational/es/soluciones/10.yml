# Solución lección 10: cada acción sube a una versión posterior a la primera
# corregida según su advisory, y se fija por hash con la versión en el comentario.
#   tj-actions/changed-files   <= 45.0.7          corregida en v46.0.1  -> v47.0.6  (CVE-2025-30066)
#   actions/download-artifact  >= 4.0.0, < 4.1.3 corregida en v4.1.3   -> v8.0.1   (GHSA-cxww-7g56-2vh6)
#   lycheeverse/lychee-action  < 2.0.2           corregida en v2.0.2   -> v2.0.2   (CVE-2024-48908)
# Las dos primeras no se quedan en la primera versión corregida porque esas
# versiones usan Node 20, que GitHub retiró de sus runners en septiembre de 2026.
# Ojo: con el hash R1025 ya no puede consultar el advisory (ver "Tensión con la
# lección 01" en el README). Dependabot o Renovate se encargan de avisarte.
# Escribir "@v47.0.6" también supera el ejercicio, pero sin la garantía del hash.
name: Revisión de PRs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ver qué ficheros han cambiado
        id: cambios
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6

      - name: Descargar el informe del build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: informe

      - name: Revisar enlaces
        uses: lycheeverse/lychee-action@7cd0af4c74a61395d455af97419279d86aafaede # v2.0.2
