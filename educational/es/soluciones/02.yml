# Solución lección 02:
# - permissions a nivel de workflow en solo lectura, y en el job solo lo que
#   hace falta para etiquetar y comentar el PR;
# - la acción de un autor desconocido se sustituye por actions/labeler, que
#   hace lo mismo y es de una organización verificada. repo-token se mantiene.
# El trigger sigue siendo pull_request_target: con pull_request, en los PRs de
# forks el token es de solo lectura y no podría etiquetar ni comentar. Aquí es
# seguro porque ningún step descarga ni ejecuta código del PR (lección 06):
# actions/labeler lee la configuración y la lista de ficheros por la API.
name: Triage de PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Etiquetar según los ficheros cambiados
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dar la bienvenida
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '¡Gracias por tu PR! Lo revisaremos pronto.'
            })
