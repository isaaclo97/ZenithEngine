# TU TURNO (lección 08): este despliegue funciona, pero deja credenciales a la
# vista. Que ningún secreto quede escrito en el fichero ni aparezca en los logs.
# Los parámetros de los steps tienen que seguir existiendo.
name: Desplegar

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Iniciar sesión en el registro
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ci-bot
          password: "dckr_pat_EXAMPLE.not.a.real.token"

      - name: Comprobar credenciales de despliegue
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Token de despliegue: $DEPLOY_TOKEN"
          PREFIJO=$(echo ${{ secrets.DEPLOY_TOKEN }} | cut -c1-8)
          echo "Prefijo del token: $PREFIJO"

      - name: Desplegar
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: ./scripts/deploy.sh --token "$DEPLOY_TOKEN"
