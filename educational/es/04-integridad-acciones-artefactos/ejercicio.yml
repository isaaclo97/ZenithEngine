# TU TURNO (lección 04): este workflow construye y publica una imagen Docker.
# Asegúrate de que solo se ejecuta código de procedencia conocida y de que la
# imagen publicada se pueda verificar. Ningún step original puede desaparecer.
name: Publicar imagen

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkuot@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Analizar el Dockerfile
        uses: hadolint-fan/hadolint-action@v3
        with:
          dockerfile: Dockerfile

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
