name: Build and publish Docker image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write   # necesario para el keyless signing de cosign vía OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: myorg/myimage:${{ github.sha }}

      - name: Instalar cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Firmar la imagen publicada (Sigstore keyless signing)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}   # por env:, como cualquier salida de un step (lección 07)
        run: cosign sign --yes "myorg/myimage@${DIGEST}"
